@if (!isAuthPage) {
<app-navbar></app-navbar>
}

@if (isWorkspacePage) {
<app-role-workspace-nav
  (expandedChange)="setWorkspaceExpanded($event)">
</app-role-workspace-nav>
}

@if (isLoading || loadingService.isLoading()) {
<app-loading></app-loading>
}

<main
  [class.auth-main]="isAuthPage"
  [class.workspace-main]="isWorkspacePage"
  [class.workspace-main--expanded]="isWorkspaceExpanded">

  <router-outlet></router-outlet>
</main>

@if (!isAuthPage && !isWorkspacePage) {
<app-footer></app-footer>
}
